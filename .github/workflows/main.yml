

    
  
          FS_DIR="$KERNEL_DIR/fs"


          if [ ! -f "$KERNEL_DIR/Makefile" ] || [ ! -f "$FS_DIR/Kconfig" ] || [ ! -f "$FS_DIR/Makefile" ]; then
            echo "::error::Kernel source tree was not found at $KERNEL_DIR. Check .github/scripts/clone_kernel.sh."
            exit 1
          fi


          # The kernel repository's submodules must be initialized separately;
          # actions/checkout submodules only applies to the workflow repository.
          git -C "$KERNEL_DIR" submodule sync --recursive
          git -C "$KERNEL_DIR" submodule update --init --recursive


          NOMOUNT_SRC=""
          while IFS= read -r SUBMODULE_PATH; do
            [ -n "$SUBMODULE_PATH" ] || continue
            SUBMODULE_DIR="$KERNEL_DIR/$SUBMODULE_PATH"
            [ -d "$SUBMODULE_DIR" ] || continue


            # Find the directory in the submodule that contains the NoMount
            # implementation and its own Kconfig/Makefile.
            NOMOUNT_C_FILE="$(find "$SUBMODULE_DIR" -type f -name nomount.c -print -quit)"
            [ -n "$NOMOUNT_C_FILE" ] || continue
            CANDIDATE_DIR="$(dirname "$NOMOUNT_C_FILE")"


            if [ -f "$CANDIDATE_DIR/Kconfig" ] && [ -f "$CANDIDATE_DIR/Makefile" ]; then
              NOMOUNT_SRC="$CANDIDATE_DIR"
              break
            fi
          done < <(git -C "$KERNEL_DIR" config -f .gitmodules --get-regexp 'submodule\..*\.path' | awk '{print $2}')


          if [ -z "$NOMOUNT_SRC" ]; then
            echo "::error::NoMount submodule source not found. Expected a submodule directory containing nomount.c, Kconfig, and Makefile."
            echo "Submodule status:"
            git -C "$KERNEL_DIR" submodule status --recursive
            exit 1
          fi


          mkdir -p "$FS_DIR/nomount"
          cp -a "$NOMOUNT_SRC/." "$FS_DIR/nomount/"


          # Ensure the top-level kernel Kconfig/Makefile reference NoMount.
          grep -Fq 'source "fs/nomount/Kconfig"' "$FS_DIR/Kconfig" || \
            printf '\nsource "fs/nomount/Kconfig"\n' >> "$FS_DIR/Kconfig"


          grep -Fq 'obj-$(CONFIG_NOMOUNT) += nomount/' "$FS_DIR/Makefile" || \
            printf '\nobj-$(CONFIG_NOMOUNT) += nomount/\n' >> "$FS_DIR/Makefile"


          echo "NoMount source copied from: $NOMOUNT_SRC"
          echo "Installed files:"
          ls -la "$FS_DIR/nomount"


      # ── Clang toolchain ──────────────────────────────────────────────────
      - name: Clone AOSP Clang Toolchain
        if: github.event.inputs.clang_toolchain == 'AOSP' && steps.cache-clang.outputs.cache-hit != 'true'
        run: |
          wget -q "$CLANG_REPO" -O clang.tar.zst
          rm -rf clang && mkdir clang
          tar --zstd -xf clang.tar.zst -C clang
          rm -f clang.tar.zst
          # Kalau isi tarball dibungkus 1 folder, ratakan supaya clang/bin/clang langsung ada
          if [ ! -d clang/bin ] && [ "$(ls -1 clang | wc -l)" -eq 1 ]; then
            inner="$(ls -1 clang)"
            mv "clang/$inner"/* clang/ 2>/dev/null || true
            mv "clang/$inner"/.[!.]* clang/ 2>/dev/null || true
            rmdir "clang/$inner" 2>/dev/null || true
          fi
          clang/bin/clang --version | head -n1


      - name: Setup Clang Toolchain
        env:
          INPUT_CLANG_TOOLCHAIN: ${{ github.event.inputs.clang_toolchain }}
        run: bash .github/scripts/setup_toolchain.sh


      # ── AnyKernel3 ─────────────────────────
      - name: Clone AnyKernel3
        run: git clone --depth=1 "$ANYKERNEL_REPO" -b "$ANYKERNEL_BRANCH" AnyKernel


      # ── KernelSU / variant selection ──────────────────────────────────────
      - name: Setup KernelSU / Build Variant
        env:
          ENABLE_KSU:        ${{ github.event.inputs.enable_ksu }}
          KSU_VARIANT_INPUT: ${{ github.event.inputs.ksu_variant }}
          ENABLE_SUSFS:      ${{ github.event.inputs.enable_susfs }}
        run: bash .github/scripts/setup_ksu.sh


      # ── Logs ─────────────────────────────────────────────────────────────
      - name: Prepare Log Paths
        run: |
          mkdir -p "$GITHUB_WORKSPACE/logs"
          echo "BUILD_LOG=$GITHUB_WORKSPACE/logs/build.log"   >> $GITHUB_ENV
          echo "ERROR_LOG=$GITHUB_WORKSPACE/logs/errors.log"  >> $GITHUB_ENV


      # ── Build ─────────────────────────────────────────────────────────────
      - name: Build Kernel
        run: bash .github/scripts/build_kernel.sh


      - name: Upload Build Logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs-${{ github.run_id }}
          path: |
            ${{ env.BUILD_LOG }}
            ${{ env.ERROR_LOG }}
            ${{ github.workspace }}/logs/rej
          retention-days: 7


      - name: Check Build Output
        run: bash .github/scripts/check_output.sh


      # ── Package ──────────────────────────────────────────────────────────
      - name: Package with AnyKernel3
        env:
          ZIP_NAME_PREFIX: ${{ github.event.inputs.zip_name }}
        run: bash .github/scripts/package_zip.sh


      # ── Telegram notifications ────────────────────────────────────────────
      - name: Send Kernel ZIP to Telegram
        if: success()
        env:
          CUSTOM_NOTE: ${{ github.event.inputs.custom_note }}
        run: bash .github/scripts/notify_success.sh


      - name: Send Failure Notification to Telegram
        if: failure()
        env:
          CUSTOM_NOTE:       ${{ github.event.inputs.custom_note }}
          ENABLE_KSU:        ${{ github.event.inputs.enable_ksu }}

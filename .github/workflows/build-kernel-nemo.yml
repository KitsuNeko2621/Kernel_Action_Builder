name: Build Kernel Nemo (NoMount)

# Workflow mandiri: tidak memerlukan file lain di repo (.github/scripts, submodule, dsb).
# Isi build.sh ditanam di step "Tulis build.sh" di bawah.

on:
  workflow_dispatch:
    inputs:
      kernel_repo:
        description: 'URL repo kernel'
        required: true
        type: string
        default: 'https://github.com/kardebayan/android_kernel_realme_nemo.git'
      kernel_branch:
        description: 'Branch kernel (kosongkan = branch default repo)'
        required: false
        type: string
        default: ''
      defconfig:
        description: 'Config kernel, pisahkan dengan spasi (kosongkan = deteksi otomatis)'
        required: false
        type: string
        default: 'k85v1_64_k419_defconfig vendor/nemo.config'
      private_repo_token:
        description: 'GitHub token (hanya jika repo kernel privat; lebih aman pakai secret KERNEL_REPO_TOKEN)'
        required: false
        type: string
        default: ''
      enable_nomount:
        description: 'Aktifkan NoMount'
        required: true
        type: boolean
        default: true
      stable_mode:
        description: 'Mode stabil: matikan NoMount, mode hemat RAM, dan patch swappiness (untuk pembanding saat bootloop)'
        required: true
        type: boolean
        default: false
      vm_tune:
        description: 'Tuning RAM untuk zram + gaming (page-cluster 0, watermark_scale_factor 30)'
        required: true
        type: boolean
        default: true
      nomount_ref:
        description: 'NoMount: branch / tag / commit'
        required: false
        type: string
        default: 'dev'
      localversion:
        description: 'Nama versi kernel (uname -r), tanpa spasi'
        required: false
        type: string
        default: '-NekoKernel'
      swappiness_default:
        description: 'Swappiness default 0-200 (maks dinaikkan jadi 200), isi off untuk tidak mengubah swappiness'
        required: false
        type: string
        default: '150'
      swappiness_lock:
        description: 'Kunci swappiness (/proc/sys/vm/swappiness jadi 0444 read-only, tidak bisa diubah setelah boot, ROM/tweak tidak bisa menimpa)'
        required: true
        type: boolean
        default: true
      lowram_mode:
        description: 'Mode hemat RAM + kompresor zram default (off = matikan mode hemat RAM)'
        required: true
        type: choice
        options:
          - 'lz4'
          - 'zstd'
          - 'lz4hc'
          - 'lzo-rle'
          - 'off'
        default: 'lz4'
      zram_size_percent:
        description: 'Ukuran zram MINIMUM (% dari RAM). 0 = tidak diubah (ROM-mu sekarang 75%). 100 = sebesar RAM, 150 = 1,5x RAM, 200 = 2x RAM (maks 200)'
        required: true
        type: string
        default: '100'
      aggressive_debug_off:
        description: 'Mode hemat RAM juga mematikan SCHEDSTATS & KPROBES (sedikit lebih ringan, tapi lebih berisiko bootloop). Default OFF'
        required: true
        type: boolean
        default: false
      clang_toolchain:
        description: 'Toolchain Clang'
        required: true
        type: choice
        options:
          - 'greenforce'
          - 'neutron'
          - 'weebx'
          - 'zyc'
        default: 'greenforce'
      clang_version:
        description: 'Greenforce / ZyC: latest | angka major (mis. 19) | tag rilis. WeebX: latest | nama branch/tag repo. Neutron: diabaikan. Setelah ada build yang stabil, isi TAG-nya (tertera di Telegram) agar build bisa diulang persis sama'
        required: false
        type: string
        default: 'latest'
      list_tags:
        description: 'Hanya tampilkan daftar tag/branch toolchain yang dipilih (tanpa build). Lihat hasilnya di log, lalu jalankan lagi dan isi clang_version dengan tag-nya'
        required: false
        type: boolean
        default: false
      zip_name:
        description: 'Awalan nama ZIP'
        required: false
        type: string
        default: 'Neko'
      custom_note:
        description: 'Catatan build (opsional, ikut ke Telegram)'
        required: false
        type: string
        default: ''

permissions:
  contents: read

jobs:
  list-tags:
    if: ${{ inputs.list_tags }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Daftar tag toolchain
        env:
          TC: ${{ inputs.clang_toolchain }}
          GH_TOKEN: ${{ github.token }}
        run: |
          case "$TC" in
            greenforce) repo="greenforce-project/greenforce_clang" ;;
            zyc)        repo="ZyCromerZ/Clang" ;;
            weebx)
              echo "WeebX Clang - branch & tag (isi salah satunya di clang_version):"
              git ls-remote --tags --heads https://github.com/XSans0/WeebX-Clang.git \
                | awk '{print $2}' | grep -v '\^{}$' \
                | sed -e 's#^refs/heads/#  branch: #' -e 's#^refs/tags/#  tag:    #'
              exit 0 ;;
            *)
              echo "Neutron selalu memakai versi terbaru (antman), tidak ada pilihan tag."
              exit 0 ;;
          esac
          echo "${TC} - tag rilis terbaru (isi di clang_version, atau angka major):"
          curl -fsSL -H "Authorization: Bearer ${GH_TOKEN}" \
            "https://api.github.com/repos/${repo}/releases?per_page=50" \
            | jq -r '.[] | select(.draft|not) | "  " + .tag_name'

  build:
    if: ${{ !inputs.list_tags }}
    runs-on: ubuntu-latest
    timeout-minutes: 340
    env:
      LC_ALL: C
      DEBIAN_FRONTEND: noninteractive
    steps:
      - name: Catat waktu mulai
        run: echo "START_TS=$(date +%s)" >> "$GITHUB_ENV"

      - name: Kosongkan ruang disk
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /opt/hostedtoolcache/CodeQL /usr/local/share/boost || true
          df -h /

      - name: Pasang dependensi
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            git make bc bison flex libssl-dev libelf-dev python3 zip unzip curl wget \
            cpio xz-utils zstd lz4 ccache build-essential libncurses-dev \
            binutils-aarch64-linux-gnu binutils-arm-linux-gnueabi

      - name: Cache ccache
        uses: actions/cache@v4
        with:
          path: ~/.ccache
          key: ccache-nemo-${{ github.run_id }}
          restore-keys: |
            ccache-nemo-

      - name: Atur ccache
        run: |
          mkdir -p "$HOME/.ccache"
          echo "CCACHE_DIR=$HOME/.ccache" >> "$GITHUB_ENV"
          ccache --set-config=max_size=5G
          ccache --set-config=compression=true
          ccache --set-config=compression_level=1

      - name: Tulis build.sh
        run: |
          mkdir -p "$HOME/work"
          cat > "$HOME/work/build.sh" <<'BUILD_SCRIPT_EOF'
          #!/bin/bash
          #
          # Build script - android_kernel_realme_nemo (Realme 6 / 6i / 6s / Narzo - MT6785, kernel 4.19)
          # Source: https://github.com/kardebayan/android_kernel_realme_nemo
          #
          # Pemakaian:
          #   ./build.sh            -> build kernel (+ zip AnyKernel3 kalau tersedia)
          #   ./build.sh clang-list -> daftar versi Greenforce Clang yang tersedia
          #   ./build.sh clean      -> bersihkan out/ dan source tree
          #   ./build.sh menuconfig -> buka menuconfig lalu simpan ke out/.config
          #   INCREMENTAL=1 ./build.sh -> lewati pembersihan (build ulang lebih cepat)
          #
          # Jalankan dari ROOT source kernel (folder yang berisi Makefile, arch/, dll).
          # Kalau script ditaruh di luar source, source otomatis di-clone ke ./android_kernel_realme_nemo.

          set -o pipefail

          # ========================
          # KONFIGURASI
          # ========================
          KERNEL_REPO="${KERNEL_REPO:-https://github.com/kardebayan/android_kernel_realme_nemo.git}"
          KERNEL_REPO_TOKEN="${KERNEL_REPO_TOKEN:-}"   # token GitHub, hanya jika repo kernel privat
          KERNEL_BRANCH="${KERNEL_BRANCH:-}"       # kosongkan = branch default repo
          # Konfigurasi kernel dideteksi otomatis (lihat check_defconfig):
          #   - branch seventeen (4.19): k85v1_64_k419_defconfig + vendor/nemo.config
          #     (gki_defconfig + nemo.config TIDAK cukup: CONFIG_MTK_PLATFORM jadi kosong)
          #   - branch lama   : RM6785_defconfig
          # Isi manual kalau mau menimpa, contoh: CONFIG_TARGETS=(gki_defconfig vendor/nemo.config)
          # Atau lewat env, contoh: NEMO_CONFIGS="gki_defconfig vendor/x.config vendor/nemo.config" ./build.sh
          read -r -a CONFIG_TARGETS <<<"${NEMO_CONFIGS:-}"
          ANYKERNEL_REPO="https://github.com/osm0sis/AnyKernel3.git"
          ZIP_NAME="${ZIP_NAME:-Kernel-nemo}"

          # --- Branding ---------------------------------------------------------------
          # Nama di `uname -r`  -> 4.19.325<LOCALVERSION>   (tanpa spasi, maks 64 karakter)
          #   LOCALVERSION=-NekoKernel ./build.sh
          LOCALVERSION_SUFFIX="${LOCALVERSION:--NekoKernel}"
          # PENTING: env LOCALVERSION dibaca langsung oleh Makefile kernel (suffix jadi dobel), jadi dibuang
          unset LOCALVERSION
          # 1 = hapus localversion-cip & localversion-st di source (kalau tidak, ikut ditempel: -cip136-st20)
          REMOVE_LOCALVERSION_FILES="${REMOVE_LOCALVERSION_FILES:-1}"
          # 1 = matikan suffix otomatis -g<hash git> (CONFIG_LOCALVERSION_AUTO)
          DISABLE_LOCALVERSION_AUTO="${DISABLE_LOCALVERSION_AUTO:-1}"
          # Teks di layar recovery (zip AnyKernel)
          # --- NoMount (VFS path redirection, https://github.com/maxsteeel/nomount) ---------
          # 1 = integrasikan NoMount built-in ke source (clone ke ./NoMount, symlink fs/nomount, CONFIG_NOMOUNT=y)
          # Butuh metamodule NoMount + root KernelSU/APatch untuk dipakai (kernel ini hanya menyediakan subsistemnya).
          NOMOUNT="${NOMOUNT:-1}"
          NOMOUNT_REPO="${NOMOUNT_REPO:-https://github.com/maxsteeel/nomount.git}"
          # Branch / tag / commit. Tulis commit atau tag supaya build bisa diulang persis sama.
          NOMOUNT_REF="${NOMOUNT_REF:-dev}"

          # --- Image.gz-dtb ---------------------------------------------------------------
          # 1 = hanya DTB utama yang ditempel ke Image.gz-dtb (seperti kernel 4.14 yang berfungsi).
          #     Tanpa ini, Makefile 4.19 ikut menempelkan 3 file overlay .dtbo ke dalam Image.gz-dtb.
          DTB_ONLY="${DTB_ONLY:-1}"

          # --- Mode hemat RAM (cocok untuk RAM 4GB) ----------------------------------------
          # 1 = aktifkan: matikan DEBUG_INFO / SCHEDSTATS / KPROBES, perkecil log buffer kernel (128 KB),
          #     dan ganti kompresor zram default
          LOWRAM="${LOWRAM:-1}"
          # 1 = mode hemat RAM juga mematikan SCHEDSTATS & KPROBES. Default 0 (konservatif): hanya DEBUG_INFO yang dimatikan.
          LOWRAM_AGGRESSIVE="${LOWRAM_AGGRESSIVE:-0}"
          # Kompresor zram default: lz4 (cepat, UI mulus) | zstd (rasio lebih baik, CPU lebih berat) |
          #                         lz4hc | lzo | lzo-rle (bawaan kernel). ROM yang menulis
          #                         /sys/block/zram0/comp_algorithm tetap menimpa nilai ini.
          ZRAM_COMP="${ZRAM_COMP:-lz4}"
          # Ukuran zram MINIMUM, % dari RAM total (0 = tidak diubah). Ukuran zram sebenarnya ditulis userspace
          # (fstab: zramsize=75%) ke /sys/block/zram0/disksize; patch ini menaikkannya ke minimal nilai ini,
          # berapa pun yang diminta ROM. Nilai lebih kecil dari ini tidak bisa diset setelah boot.
          ZRAM_MIN_PERCENT="${ZRAM_MIN_PERCENT:-0}"

          # --- Swappiness ---------------------------------------------------------------
          # 1 = patch source: batas swappiness 100 -> 200 (sysctl & memcg), default diatur di bawah
          SWAPPINESS_PATCH="${SWAPPINESS_PATCH:-1}"
          # Nilai default saat boot (0-200). Kalau SWAPPINESS_LOCK=1, ini jadi nilai TETAP.
          SWAPPINESS_DEFAULT="${SWAPPINESS_DEFAULT:-150}"
          # 1 = kunci: /proc/sys/vm/swappiness jadi 0444 (read-only, root pun tidak bisa menulis) dan
          #     tulis ke memory.swappiness cgroup ROOT diabaikan (tetap dianggap sukses, tidak mengubah nilai)
          SWAPPINESS_LOCK="${SWAPPINESS_LOCK:-1}"
          AK_KERNEL_STRING="${AK_KERNEL_STRING:-Neko Kernel}"
          AK_AUTHOR="${AK_AUTHOR:-KitsuNeko}"      # tampil sebagai "By <AK_AUTHOR>" (disarankan 12 karakter agar bingkai lurus)
          # Kode model yang boleh flash (do.devicecheck=1). Spasi sebagai pemisah.
          AK_DEVICES="${AK_DEVICES:-RMX2151 rmx2151 RMX2161 rmx2161 RMX2001 rmx2001 RMX2002 rmx2002 RMX2002L1 rmx2002L1 RMX2001L1 rmx2001L1 RMX2003 RMX2153 RMX2153L1 RMX2156 RMX2163 RMX2161L1 RMX2163L1 RMX3031 IN2023 GM1917 RM6785 rm6785 wasabi}"

          # --- Tuning manajemen RAM (zram + gaming) -----------------------------------------
          # 1 = aktifkan patch default VM di bawah (nilainya tetap bisa diubah lewat /proc/sys/vm/ saat runtime)
          VM_TUNE="${VM_TUNE:-1}"
          # page-cluster 0: swap-in dari zram membaca 1 halaman, bukan 8 (bawaan kernel 3). Standar untuk zram.
          VM_PAGE_CLUSTER="${VM_PAGE_CLUSTER:-0}"
          # watermark_scale_factor: jarak watermark kswapd (bawaan 10 = 0,1% RAM). Lebih besar = kswapd bangun
          # lebih awal sehingga direct reclaim (penyebab stutter) berkurang, dengan biaya sedikit RAM bebas.
          VM_WATERMARK_SCALE="${VM_WATERMARK_SCALE:-30}"

          # --- Mode stabil -------------------------------------------------------------------
          # 1 = build konservatif: matikan semua tambahan (NoMount, mode hemat RAM, patch swappiness).
          #     Berguna sebagai pembanding saat mencari penyebab bootloop. Patch DTB tetap berlaku.
          STABLE="${STABLE:-0}"
          if [ "${STABLE}" = "1" ]; then
              NOMOUNT=0
              LOWRAM=0
              SWAPPINESS_PATCH=0
              VM_TUNE=0
              ZRAM_MIN_PERCENT=0
          fi

          if [ -f "${PWD}/Makefile" ] && [ -d "${PWD}/arch/arm64" ]; then
              KERNEL_DIR="${PWD}"
          else
              KERNEL_DIR="${PWD}/android_kernel_realme_nemo"
          fi

          OUT_DIR="${KERNEL_DIR}/out"
          # Pilihan toolchain: greenforce (default) | neutron | weebx | zyc
          #   CLANG_TYPE=neutron ./build.sh
          # Versi Greenforce / ZyC Clang (untuk CLANG_TYPE=greenforce atau zyc):
          #   GF_CLANG_VERSION=latest     -> rilis terbaru (default)
          #   GF_CLANG_VERSION=17         -> rilis terbaru dari clang 17 (angka major)
          #   GF_CLANG_VERSION=20261031   -> tag rilis tertentu
          #   Daftar yang tersedia: ./build.sh clang-list
          # WeebX Clang: GF_CLANG_VERSION=latest -> branch default repo, atau isi nama branch/tag.
          # Tanpa env di atas, saat dijalankan di terminal akan muncul MENU pilihan toolchain.
          CLANG_TYPE_SET="${CLANG_TYPE:-}"
          GF_CLANG_VERSION_SET="${GF_CLANG_VERSION:-}"
          CLANG_DIR_USER="${CLANG_DIR:-}"          # sudah punya clang sendiri? CLANG_DIR=/path/clang ./build.sh
          CLANG_TYPE="${CLANG_TYPE:-greenforce}"
          GF_CLANG_VERSION="${GF_CLANG_VERSION:-latest}"
          ANYKERNEL_DIR="${KERNEL_DIR}/../AnyKernel3"
          JOBS=$(nproc --all)

          RED='\033[0;31m'; GREEN='\033[0;32m'; YELLOW='\033[1;33m'; BLUE='\033[0;34m'; NC='\033[0m'
          # Seluruh proses (bukan hanya kompilasi) dicatat ke error.log, supaya log yang dikirim selalu terbaru
          LOG_FILE="${KERNEL_DIR}/error.log"
          _log_file()   { [ -d "${KERNEL_DIR}" ] && echo "$*" >> "${LOG_FILE}"; return 0; }
          log_info()    { echo -e "${BLUE}[INFO]${NC} $1";    _log_file "[INFO] $1"; }
          log_success() { echo -e "${GREEN}[OK]${NC} $1";     _log_file "[OK] $1"; }
          log_warn()    { echo -e "${YELLOW}[WARN]${NC} $1";  _log_file "[WARN] $1"; }
          log_error()   { echo -e "${RED}[ERROR]${NC} $1";    _log_file "[ERROR] $1"; }

          # ========================
          # FUNGSI
          # ========================
          check_deps() {
              log_info "Memeriksa dependensi sistem..."
              local deps=(git make bc bison flex libssl-dev libelf-dev python3 zip curl wget cpio xz-utils zstd lz4 ccache build-essential libncurses-dev binutils-aarch64-linux-gnu binutils-arm-linux-gnueabi)
              local missing=()
              for dep in "${deps[@]}"; do
                  dpkg -s "$dep" &>/dev/null || missing+=("$dep")
              done
              if [ ${#missing[@]} -ne 0 ]; then
                  log_warn "Dependensi belum ada: ${missing[*]}"
                  sudo apt-get update -qq
                  sudo apt-get install -y "${missing[@]}" || {
                      log_error "Gagal install. Jalankan manual: sudo apt-get install -y ${missing[*]}"
                      exit 1
                  }
              fi
              log_success "Semua dependensi tersedia."
          }

          get_source() {
              if [ ! -f "${KERNEL_DIR}/Makefile" ]; then
                  log_info "Source kernel belum ada, clone dari ${KERNEL_REPO}..."
                  local branch_opt=()
                  [ -n "${KERNEL_BRANCH}" ] && branch_opt=(-b "${KERNEL_BRANCH}")
                  local clone_url="${KERNEL_REPO}"
                  if [ -n "${KERNEL_REPO_TOKEN}" ] && [[ "${KERNEL_REPO}" == https://github.com/* ]]; then
                      clone_url="https://x-access-token:${KERNEL_REPO_TOKEN}@${KERNEL_REPO#https://}"
                  fi
                  git clone --depth=1 "${branch_opt[@]}" "${clone_url}" "${KERNEL_DIR}" || {
                      log_error "Gagal clone source kernel (cek URL/branch/token)."
                      exit 1
                  }
                  # jangan simpan token di .git/config
                  git -C "${KERNEL_DIR}" remote set-url origin "${KERNEL_REPO}" 2>/dev/null || true
                  OUT_DIR="${KERNEL_DIR}/out"
              fi
          }

          # Greenforce Clang (https://github.com/greenforce-project/greenforce_clang)
          GF_API="https://api.github.com/repos/greenforce-project/greenforce_clang/releases"
          # Rilis cadangan bila API tidak bisa dipakai (hanya untuk GF_CLANG_VERSION=latest)
          GF_FALLBACK_TAG="20072024"
          GF_FALLBACK_MAJOR="19"
          GF_FALLBACK_URL="https://github.com/greenforce-project/greenforce_clang/releases/download/20072024/greenforce-clang-19.0.0git-20072024.tar.zst"

          # Output: <tag> TAB <clang major> TAB <url asset>, rilis terbaru di baris pertama
          gf_list() {
              local api="${1:-${GF_API}}" page out auth=()
              [ -n "${GITHUB_TOKEN:-}" ] && auth=(-H "Authorization: Bearer ${GITHUB_TOKEN}")
              for page in 1 2 3; do
                  out=$(curl -fsSL "${auth[@]}" "${api}?per_page=100&page=${page}" | python3 -c '
          import sys, json, re
          for r in json.load(sys.stdin):
              if r.get("draft"):
                  continue
              for a in r.get("assets", []):
                  n = a["name"]
                  if not n.endswith((".tar.gz", ".tar.zst", ".tar.xz")):
                      continue
                  m = re.search(r"clang-(\d+)\.\d+\.\d+", n, re.I)
                  print(r["tag_name"], m.group(1) if m else "?", a["browser_download_url"], sep="\t")
                  break
          ') || break
                  [ -z "${out}" ] && break
                  printf '%s\n' "${out}"
              done
          }

          gf_resolve() {
              local list line
              list=$(gf_list)
              if [ -z "${list}" ]; then
                  if [ "${GF_CLANG_VERSION}" = "latest" ]; then
                      # API GitHub gagal (rate limit / jaringan): pakai rilis cadangan yang sudah diketahui ada
                      log_warn "Daftar rilis Greenforce Clang gagal diambil, memakai rilis cadangan ${GF_FALLBACK_TAG} (clang ${GF_FALLBACK_MAJOR})."
                      GF_TAG="${GF_FALLBACK_TAG}"; GF_MAJOR="${GF_FALLBACK_MAJOR}"; GF_URL="${GF_FALLBACK_URL}"
                      return 0
                  fi
                  log_error "Gagal mengambil daftar rilis Greenforce Clang (jaringan / rate limit GitHub? set GITHUB_TOKEN)."
                  return 1
              fi
              case "${GF_CLANG_VERSION}" in
                  latest)           line=$(head -n1 <<<"${list}") ;;
                  [0-9]|[0-9][0-9]) line=$(awk -F'\t' -v v="${GF_CLANG_VERSION}" '$2==v{print; exit}' <<<"${list}") ;;
                  *)                line=$(awk -F'\t' -v v="${GF_CLANG_VERSION}" '$1==v{print; exit}' <<<"${list}") ;;
              esac
              if [ -z "${line}" ]; then
                  log_error "GF_CLANG_VERSION='${GF_CLANG_VERSION}' tidak ditemukan. Versi major yang ada:"
                  awk -F'\t' '!seen[$2]++{printf "    clang %s\n",$2}' <<<"${list}"
                  return 1
              fi
              IFS=$'\t' read -r GF_TAG GF_MAJOR GF_URL <<<"${line}"
          }

          list_clang() {
              local list
              list=$(gf_list)
              [ -n "${list}" ] || { log_error "Gagal mengambil daftar rilis."; exit 1; }
              echo "Greenforce Clang - rilis terbaru tiap versi major:"
              awk -F'\t' '!seen[$2]++{printf "  clang %-4s tag %s\n",$2,$1}' <<<"${list}"
              echo ""
              echo "Semua tag:"
              awk -F'\t' '{printf "  %s (clang %s)\n",$1,$2}' <<<"${list}"
              echo ""
              echo "Pakai: GF_CLANG_VERSION=<major|tag|latest> ./build.sh"
          }

          download_greenforce() {
              gf_resolve || return 1
              log_info "Greenforce Clang ${GF_MAJOR} (tag ${GF_TAG})"
              log_info "Mengunduh: ${GF_URL}"
              local tmp; tmp=$(mktemp -d)
              wget -q --show-progress -O "${tmp}/clang.tar" "${GF_URL}" || { rm -rf "${tmp}"; return 1; }
              mkdir -p "${tmp}/x"
              tar -xf "${tmp}/clang.tar" -C "${tmp}/x" || { rm -rf "${tmp}"; log_error "Gagal ekstrak (butuh zstd untuk .tar.zst)."; return 1; }

              # Arsip bisa berisi folder pembungkus; cari lokasi bin/clang sebenarnya
              local bin; bin=$(find "${tmp}/x" -maxdepth 5 -path '*/bin/clang' \( -type f -o -type l \) | head -n1)
              if [ -z "${bin}" ]; then
                  log_error "bin/clang tidak ada di arsip. Isi arsip (level atas):"
                  ls -la "${tmp}/x" | sed 's/^/    /'
                  rm -rf "${tmp}"
                  return 1
              fi
              rm -rf "${CLANG_DIR}"
              mkdir -p "$(dirname "${CLANG_DIR}")"
              mv "$(dirname "$(dirname "${bin}")")" "${CLANG_DIR}"
              echo "${GF_TAG}" > "${CLANG_DIR}/.gf_tag"
              rm -rf "${tmp}"
          }

          # ZyCromerZ Clang (https://github.com/ZyCromerZ/Clang) - biner ada di GitHub Releases
          ZYC_API="https://api.github.com/repos/ZyCromerZ/Clang/releases"

          download_zyc() {
              local list line
              list=$(gf_list "${ZYC_API}")
              if [ -z "${list}" ]; then
                  log_error "Gagal mengambil daftar rilis ZyC Clang (jaringan / rate limit GitHub? set GITHUB_TOKEN)."
                  return 1
              fi
              case "${GF_CLANG_VERSION}" in
                  latest)           line=$(head -n1 <<<"${list}") ;;
                  [0-9]|[0-9][0-9]) line=$(awk -F'\t' -v v="${GF_CLANG_VERSION}" '$2==v{print; exit}' <<<"${list}") ;;
                  *)                line=$(awk -F'\t' -v v="${GF_CLANG_VERSION}" '$1==v{print; exit}' <<<"${list}") ;;
              esac
              if [ -z "${line}" ]; then
                  log_error "Versi ZyC '${GF_CLANG_VERSION}' tidak ditemukan. Versi major yang ada:"
                  awk -F'\t' '!seen[$2]++{printf "    clang %s\n",$2}' <<<"${list}"
                  return 1
              fi
              local ztag zmajor zurl
              IFS=$'\t' read -r ztag zmajor zurl <<<"${line}"
              log_info "ZyC Clang ${zmajor} (tag ${ztag})"
              log_info "Mengunduh: ${zurl}"
              local tmp; tmp=$(mktemp -d)
              wget -q --show-progress -O "${tmp}/clang.tar" "${zurl}" || { rm -rf "${tmp}"; return 1; }
              mkdir -p "${tmp}/x"
              tar -xf "${tmp}/clang.tar" -C "${tmp}/x" || { rm -rf "${tmp}"; log_error "Gagal ekstrak arsip ZyC Clang."; return 1; }
              local bin; bin=$(find "${tmp}/x" -maxdepth 5 -path '*/bin/clang' \( -type f -o -type l \) | head -n1)
              if [ -z "${bin}" ]; then
                  log_error "bin/clang tidak ada di arsip ZyC. Isi arsip (level atas):"
                  ls -la "${tmp}/x" | sed 's/^/    /'
                  rm -rf "${tmp}"
                  return 1
              fi
              rm -rf "${CLANG_DIR}"
              mkdir -p "$(dirname "${CLANG_DIR}")"
              mv "$(dirname "$(dirname "${bin}")")" "${CLANG_DIR}"
              echo "${ztag}" > "${CLANG_DIR}/.gf_tag"
              rm -rf "${tmp}"
          }

          # WeebX Clang (https://github.com/XSans0/WeebX-Clang) - biner ada di dalam repo git
          WEEBX_REPO="https://github.com/XSans0/WeebX-Clang.git"

          download_weebx() {
              local ref=""
              case "${GF_CLANG_VERSION}" in
                  latest|[0-9]|[0-9][0-9]) ref="" ;;
                  *) ref="${GF_CLANG_VERSION}" ;;
              esac
              log_info "WeebX Clang (${ref:-branch default})"
              if [ -n "${ref}" ] && ! git ls-remote --exit-code --heads --tags "${WEEBX_REPO}" "${ref}" >/dev/null 2>&1; then
                  log_error "Branch/tag WeebX '${ref}' tidak ditemukan. Yang tersedia:"
                  git ls-remote --tags --heads "${WEEBX_REPO}" | awk '{print $2}' | grep -v '\^{}$' \
                      | sed -e 's#^refs/heads/#    branch: #' -e 's#^refs/tags/#    tag:    #'
                  return 1
              fi
              local tmp; tmp=$(mktemp -d)
              git clone --depth=1 ${ref:+-b "${ref}"} "${WEEBX_REPO}" "${tmp}/x" || { rm -rf "${tmp}"; log_error "Gagal clone ${WEEBX_REPO}"; return 1; }
              local commit; commit=$(git -C "${tmp}/x" rev-parse --short HEAD 2>/dev/null || echo "-")
              rm -rf "${tmp}/x/.git"
              local bin; bin=$(find "${tmp}/x" -maxdepth 5 -path '*/bin/clang' \( -type f -o -type l \) | head -n1)
              if [ -z "${bin}" ]; then
                  log_error "bin/clang tidak ada di repo WeebX. Isi repo (level atas):"
                  ls -la "${tmp}/x" | sed 's/^/    /'
                  rm -rf "${tmp}"
                  return 1
              fi
              rm -rf "${CLANG_DIR}"
              mkdir -p "$(dirname "${CLANG_DIR}")"
              mv "$(dirname "$(dirname "${bin}")")" "${CLANG_DIR}"
              echo "${commit}" > "${CLANG_DIR}/.gf_tag"
              rm -rf "${tmp}"
          }

          download_neutron() {
              mkdir -p "${CLANG_DIR}" && pushd "${CLANG_DIR}" >/dev/null || return 1
              bash <(curl -s https://raw.githubusercontent.com/Neutron-Toolchains/antman/main/antman) -S=latest
              local rc=$?
              popd >/dev/null
              return ${rc}
          }

          resolve_clang_dir() {
              if [ -n "${CLANG_DIR_USER}" ]; then
                  CLANG_DIR="${CLANG_DIR_USER}"
              elif [ "${CLANG_TYPE}" = "greenforce" ]; then
                  CLANG_DIR="${KERNEL_DIR}/../clang-greenforce-${GF_CLANG_VERSION}"
              elif [ "${CLANG_TYPE}" = "zyc" ] || [ "${CLANG_TYPE}" = "weebx" ]; then
                  CLANG_DIR="${KERNEL_DIR}/../clang-${CLANG_TYPE}-${GF_CLANG_VERSION//\//_}"
              else
                  CLANG_DIR="${KERNEL_DIR}/../clang-${CLANG_TYPE}"
              fi
          }

          # Menu interaktif (hanya di terminal, dan hanya jika tidak ada env pilihan)
          choose_clang() {
              [ -n "${CLANG_DIR_USER}${CLANG_TYPE_SET}${GF_CLANG_VERSION_SET}" ] && return
              [ -t 0 ] && [ -t 1 ] || return

              local list; list=$(gf_list)
              local -a labels=() types=() vers=()
              if [ -n "${list}" ]; then
                  local tag major _u n=0
                  while IFS=$'\t' read -r tag major _u; do
                      n=$((n + 1))
                      if [ "${n}" -eq 1 ]; then
                          labels+=("Greenforce Clang ${major} - terbaru (tag ${tag})")
                      else
                          labels+=("Greenforce Clang ${major} (tag ${tag})")
                      fi
                      types+=(greenforce); vers+=("${major}")
                  done < <(awk -F'\t' '!seen[$2]++' <<<"${list}")
              else
                  log_warn "Daftar Greenforce Clang tidak bisa diambil, hanya Neutron yang ditawarkan."
              fi
              labels+=("Neutron Clang (Antman, terbaru)"); types+=(neutron); vers+=(latest)
              labels+=("WeebX Clang (branch default)"); types+=(weebx); vers+=(latest)
              labels+=("ZyC Clang (rilis terbaru)"); types+=(zyc); vers+=(latest)

              echo "Pilih toolchain:"
              local i
              for i in "${!labels[@]}"; do printf "  %2d) %s\n" $((i + 1)) "${labels[$i]}"; done
              local ans; read -rp "Pilihan [1]: " ans
              ans="${ans:-1}"
              if ! [[ "${ans}" =~ ^[0-9]+$ ]] || [ "${ans}" -lt 1 ] || [ "${ans}" -gt "${#labels[@]}" ]; then
                  log_warn "Pilihan tidak valid, memakai nomor 1."; ans=1
              fi
              CLANG_TYPE="${types[$((ans - 1))]}"
              GF_CLANG_VERSION="${vers[$((ans - 1))]}"
          }

          get_clang() {
              choose_clang
              resolve_clang_dir
              # CLANG_REFRESH=1 -> unduh ulang (berguna untuk GF_CLANG_VERSION=latest)
              [ "${CLANG_REFRESH:-0}" = "1" ] && [ "${CLANG_TYPE}" != "neutron" ] && [ -z "${CLANG_DIR_USER}" ] && rm -rf "${CLANG_DIR}"
              if [ ! -x "${CLANG_DIR}/bin/clang" ]; then
                  log_warn "Clang (${CLANG_TYPE}) tidak ditemukan di ${CLANG_DIR}. Mengunduh..."
                  case "${CLANG_TYPE}" in
                      greenforce) download_greenforce ;;
                      neutron)    download_neutron ;;
                      weebx)      download_weebx ;;
                      zyc)        download_zyc ;;
                      *) log_error "CLANG_TYPE tidak dikenal: ${CLANG_TYPE} (pilih: greenforce | neutron | weebx | zyc)"; exit 1 ;;
                  esac || { log_error "Gagal menyiapkan clang. Taruh manual di: ${CLANG_DIR}"; exit 1; }
              fi
              [ -x "${CLANG_DIR}/bin/clang" ] || { log_error "clang masih tidak ditemukan di ${CLANG_DIR}/bin."; exit 1; }
              log_success "Clang (${CLANG_TYPE}): $("${CLANG_DIR}/bin/clang" --version | head -n1)"
          }

          check_defconfig() {
              local cfg="${KERNEL_DIR}/arch/arm64/configs"
              # nemo_defconfig di sebelah build.sh (mis. hasil ekstrak dari boot.img) -> salin ke source
              local here; here="$(cd "$(dirname "${BASH_SOURCE[0]}")" && pwd)"
              if [ ! -f "${cfg}/RM6785_defconfig" ] && [ -f "${here}/nemo_defconfig" ] && [ ! -f "${cfg}/nemo_defconfig" ]; then
                  cp "${here}/nemo_defconfig" "${cfg}/nemo_defconfig"
                  log_info "nemo_defconfig disalin ke arch/arm64/configs/"
              fi
              if [ ${#CONFIG_TARGETS[@]} -eq 0 ]; then
                  if   [ -f "${cfg}/k85v1_64_k419_defconfig" ] && [ -f "${cfg}/vendor/nemo.config" ]; then
                      CONFIG_TARGETS=(k85v1_64_k419_defconfig vendor/nemo.config)
                  elif [ -f "${cfg}/RM6785_defconfig" ]; then
                      CONFIG_TARGETS=(RM6785_defconfig)
                  elif [ -f "${cfg}/nemo_defconfig" ]; then
                      CONFIG_TARGETS=(nemo_defconfig)
                  elif [ -f "${cfg}/gki_defconfig" ] && [ -f "${cfg}/vendor/nemo.config" ]; then
                      CONFIG_TARGETS=(gki_defconfig vendor/nemo.config)
                  fi
              fi
              if [ ${#CONFIG_TARGETS[@]} -eq 0 ]; then
                  log_error "Tidak menemukan defconfig nemo. File yang mirip:"
                  (cd "${cfg}" && ls -d *6785* *nemo* vendor/*nemo* 2>/dev/null | sed 's/^/    /')
                  echo "  Isi array CONFIG_TARGETS di atas script ini."
                  exit 1
              fi
              local t
              for t in "${CONFIG_TARGETS[@]}"; do
                  [ -f "${cfg}/${t}" ] || { log_error "Tidak ada: arch/arm64/configs/${t}"; exit 1; }
              done
              log_info "Konfigurasi: ${CONFIG_TARGETS[*]}"
          }

          # Pastikan hasil merge config lengkap. Tanpa CONFIG_MTK_PLATFORM="mt6785", build akan
          # gagal di tengah jalan (mis. fair.c: pod_is_ready/perf_order_domains, io-pgtable: ARM_V8L_FAST)
          # karena opsi platform MTK tidak aktif. Lebih baik berhenti sekarang daripada setelah berjam-jam.
          verify_config() {
              local c="${OUT_DIR}/.config" bad=0
              grep -q '^CONFIG_MTK_PLATFORM="mt6785"' "$c" || {
                  log_error "CONFIG_MTK_PLATFORM bukan \"mt6785\" -> konfigurasi tidak lengkap."; bad=1; }
              grep -q '^CONFIG_BUILD_ARM64_APPENDED_DTB_IMAGE=y' "$c" || {
                  log_warn "APPENDED_DTB_IMAGE tidak aktif; output bisa bukan Image.gz-dtb."; }
              grep -q 'mediatek/mt6785' "$c" || log_warn "DTB mt6785 tidak terdaftar di .config."
              if [ "${bad}" -eq 1 ]; then
                  {
                  echo "  Konfigurasi dipakai: ${CONFIG_TARGETS[*]}"
                  echo "  Cari defconfig/fragmen yang benar di repo (README, build.config*, .github/workflows,"
                  echo "  kernel/configs/, arch/arm64/configs/), lalu jalankan:"
                  echo "    NEMO_CONFIGS=\"<defconfig> <fragmen.config> ...\" ./build.sh"
                  echo "  Atau ambil config dari HP yang sudah memakai kernel ini:"
                  echo "    adb shell su -c 'zcat /proc/config.gz' > arch/arm64/configs/nemo_defconfig"
                  } | tee -a "${LOG_FILE}"
                  [ "${ALLOW_BAD_CONFIG:-0}" = "1" ] || exit 1
              fi
          }

          # vDSO 32-bit (CONFIG_COMPAT_VDSO) butuh clang dengan target ARM. Sebagian build
          # Greenforce Clang hanya berisi target AArch64/x86, sehingga gagal dengan:
          #   "No available targets are compatible with triple armv7-unknown-linux-gnueabi"
          # DISABLE_COMPAT_VDSO=auto (default) | 1 (selalu matikan) | 0 (jangan diubah)
          fix_compat_vdso() {
              local mode="${DISABLE_COMPAT_VDSO:-auto}"
              grep -q '^CONFIG_COMPAT_VDSO=y' "${OUT_DIR}/.config" || return 0
              [ "${mode}" = "0" ] && return 0
              if [ "${mode}" = "auto" ] && \
                 "${CLANG_DIR}/bin/clang" --print-targets 2>/dev/null | grep -qE '^[[:space:]]+arm[[:space:]]'; then
                  return 0
              fi
              log_warn "Clang ini tidak punya target ARM 32-bit -> CONFIG_COMPAT_VDSO dimatikan."
              log_warn "(Aplikasi 32-bit tetap jalan; hanya gettimeofday/clock_gettime-nya lewat syscall.)"
              bash "${KERNEL_DIR}/scripts/config" --file "${OUT_DIR}/.config" -d COMPAT_VDSO
              make "${MAKE_ARGS[@]}" olddefconfig || { log_error "olddefconfig gagal."; exit 1; }
          }

          setup_env() {
              cd "${KERNEL_DIR}" || { log_error "Tidak bisa masuk ke ${KERNEL_DIR}"; exit 1; }
              export PATH="${CLANG_DIR}/bin:${PATH}"
              export ARCH=arm64
              export KBUILD_BUILD_USER="${KBUILD_BUILD_USER:-builder}"
              export KBUILD_BUILD_HOST="${KBUILD_BUILD_HOST:-nemo}"
              local cc="clang"
              command -v ccache &>/dev/null && cc="ccache clang"
              MAKE_ARGS=(
                  -j"${JOBS}"
                  O="${OUT_DIR}"
                  ARCH=arm64
                  LLVM=1
                  LLVM_IAS=1
                  CC="${cc}"
                  LD=ld.lld
                  AR=llvm-ar
                  NM=llvm-nm
                  OBJCOPY=llvm-objcopy
                  OBJDUMP=llvm-objdump
                  READELF=llvm-readelf
                  STRIP=llvm-strip
                  CROSS_COMPILE=aarch64-linux-gnu-
                  CROSS_COMPILE_ARM32=arm-linux-gnueabi-
                  CROSS_COMPILE_COMPAT=arm-linux-gnueabi-
                  CLANG_TRIPLE=aarch64-linux-gnu-
              )
          }

          cleanup() {
              log_info "Membersihkan out/ dan source tree..."
              rm -rf "${OUT_DIR}"
              # Build out-of-tree menolak source tree yang "kotor" (sisa build di dalam source).
              # 'make mrproper' GAGAL di repo ini (ada subfolder MTK yang tidak ada), jadi file
              # hasil generate dihapus manual.
              (
                  cd "${KERNEL_DIR}" || exit 0
                  rm -rf .config .config.old .version Module.symvers include/config include/generated \
                         arch/*/include/generated
              )
              mkdir -p "${OUT_DIR}"
          }

          # Makefile boot kernel 4.19 ini menempelkan overlay (.dtbo) ke Image.gz-dtb; kernel 4.14 hanya DTB utama.
          # Pindahkan definisi DTB_OBJS ke sebelum daftar overlay ditambahkan (idempoten).
          patch_dtb_append() {
              [ "${DTB_ONLY}" = "1" ] || return 0
              python3 - "${KERNEL_DIR}/arch/arm64/boot/Makefile" <<'PY' 2>&1 | tee -a "${LOG_FILE}"
          import re, sys
          p = sys.argv[1]
          s = open(p).read()
          obj = "DTB_OBJS := $(addprefix $(obj)/dts/,$(DTB_LIST))\n"
          i_obj = s.find(obj)
          i_dtbo = s.find("DTBO_NAMES :=")
          if i_obj < 0 or i_dtbo < 0:
              print("[PATCH] arch/arm64/boot/Makefile: pola tidak dikenali, dilewati")
              sys.exit(0)
          if i_obj < i_dtbo:
              print("[PATCH] arch/arm64/boot/Makefile: sudah hanya DTB utama, tidak ada perubahan")
              sys.exit(0)
          s = s.replace(obj, "", 1)
          s = s.replace("DTBO_NAMES :=", obj + "\nDTBO_NAMES :=", 1)
          open(p, "w").write(s)
          print("[PATCH] arch/arm64/boot/Makefile: Image.gz-dtb hanya berisi DTB utama (overlay tidak ditempel)")
          PY
          }

          # Default VM untuk zram + gaming (idempoten). Nilai tetap bisa diubah saat runtime lewat sysctl.
          patch_vm_tuning() {
              [ "${VM_TUNE}" = "1" ] || return 0
              local v
              for v in "${VM_PAGE_CLUSTER}:0:6:VM_PAGE_CLUSTER" "${VM_WATERMARK_SCALE}:1:1000:VM_WATERMARK_SCALE"; do
                  local val="${v%%:*}" rest="${v#*:}"
                  local lo="${rest%%:*}"; rest="${rest#*:}"
                  local hi="${rest%%:*}" name="${rest#*:}"
                  if ! [[ "${val}" =~ ^[0-9]+$ ]] || [ "${val}" -lt "${lo}" ] || [ "${val}" -gt "${hi}" ]; then
                      log_error "${name} harus angka ${lo}-${hi} (sekarang: '${val}')"
                      exit 1
                  fi
              done
              local swp="${KERNEL_DIR}/mm/swap.c" pga="${KERNEL_DIR}/mm/page_alloc.c"
              if grep -qE '^[[:space:]]+page_cluster = [0-9]+;' "${swp}" && grep -qE '^int watermark_scale_factor = [0-9]+;' "${pga}"; then
                  sed -i -E "s/^([[:space:]]+page_cluster = )[0-9]+;/\1${VM_PAGE_CLUSTER};/" "${swp}"
                  sed -i -E "s/^(int watermark_scale_factor = )[0-9]+;/\1${VM_WATERMARK_SCALE};/" "${pga}"
                  log_info "VM tuning: page-cluster=${VM_PAGE_CLUSTER}, watermark_scale_factor=${VM_WATERMARK_SCALE}"
              else
                  log_warn "Pola kode VM (swap.c / page_alloc.c) tidak dikenali, VM tuning dilewati."
              fi
          }

          # Patch swappiness langsung di source (idempoten: aman dijalankan berulang kali)
          patch_swappiness() {
              [ "${SWAPPINESS_PATCH}" = "1" ] || return 0
              if ! [[ "${SWAPPINESS_DEFAULT}" =~ ^[0-9]+$ ]] || [ "${SWAPPINESS_DEFAULT}" -gt 200 ]; then
                  log_error "SWAPPINESS_DEFAULT harus angka 0-200 (sekarang: '${SWAPPINESS_DEFAULT}')"
                  exit 1
              fi
              log_info "Patch swappiness: maks 200, default ${SWAPPINESS_DEFAULT}, kunci=${SWAPPINESS_LOCK}"
              python3 - "${KERNEL_DIR}" "${SWAPPINESS_DEFAULT}" "${SWAPPINESS_LOCK}" <<'PY' 2>&1 | tee -a "${LOG_FILE}"
          import re, sys
          root, default, lock = sys.argv[1], sys.argv[2], sys.argv[3] == "1"
          failed = False

          def edit(path, fn, label):
              global failed
              f = f"{root}/{path}"
              src = open(f).read()
              out, msg = fn(src)
              if out is None:
                  print(f"[ERROR] {path}: {label} -> pola tidak ditemukan (source berbeda?)")
                  failed = True
                  return
              if out != src:
                  open(f, "w").write(out)
              print(f"[PATCH] {path}: {label} ({msg})")

          # --- kernel/sysctl.c : batas 200 (+ mode 0444 kalau dikunci)
          def sysctl(src):
              if "static int two_hundred" not in src:
                  src, n = re.subn(r"(static int one_hundred = 100;\n)", r"\1static int two_hundred = 200;\n", src, count=1)
                  if n == 0:
                      return None, ""
              m = re.search(r'\{\s*\.procname\s*=\s*"swappiness",.*?\n\t\},', src, re.S)
              if not m:
                  return None, ""
              blk = m.group(0)
              new = blk.replace("&one_hundred", "&two_hundred")
              if lock:
                  new = re.sub(r"\.mode(\s*)= 0[0-7]{3}", r".mode\1= 0444", new, count=1)
              return src.replace(blk, new, 1), ("maks=200, mode=" + ("0444" if lock else "tetap"))
          edit("kernel/sysctl.c", sysctl, "sysctl vm.swappiness")

          # --- mm/memcontrol.c : batas 200 (+ abaikan tulis ke cgroup root kalau dikunci)
          def memcg(src):
              m = re.search(r"static int mem_cgroup_swappiness_write\(.*?\n\}\n", src, re.S)
              if not m:
                  return None, ""
              fn = m.group(0)
              new = fn.replace("if (val > 100)", "if (val > 200)")
              if lock:
                  new = re.sub(
                      r"\tif \(css->parent\)\n\t\tmemcg->swappiness = val;\n\telse\n\t\tvm_swappiness = val;\n",
                      "\tif (css->parent)\n\t\tmemcg->swappiness = val;\n"
                      "\t/* root cgroup: nilai global dikunci, tulisan diabaikan tapi dianggap sukses */\n",
                      new)
                  if "vm_swappiness = val" in new:
                      return None, ""
              return src.replace(fn, new, 1), "maks=200" + (", root diabaikan" if lock else "")
          edit("mm/memcontrol.c", memcg, "memory.swappiness")

          # --- mm/vmscan.c : nilai default
          def vmscan(src):
              new, n = re.subn(r"int vm_swappiness = \d+;", f"int vm_swappiness = {default};", src, count=1)
              return (new, f"default={default}") if n else (None, "")
          edit("mm/vmscan.c", vmscan, "vm_swappiness default")

          sys.exit(1 if failed else 0)
          PY
              [ "${PIPESTATUS[0]}" -eq 0 ] || { log_error "Patch swappiness gagal, build dihentikan."; exit 1; }
          }

          # Integrasi NoMount ke source (setara kernel/setup.sh milik NoMount, tanpa "curl | bash")
          setup_nomount() {
              [ "${NOMOUNT}" = "1" ] || return 0
              local nm="${KERNEL_DIR}/NoMount" fs="${KERNEL_DIR}/fs"
              [ -d "${fs}" ] || { log_error "Folder fs/ tidak ada di ${KERNEL_DIR}"; exit 1; }

              log_info "NoMount: menyiapkan (${NOMOUNT_REF})..."
              if [ ! -d "${nm}/.git" ]; then
                  rm -rf "${nm}"
                  git clone -q "${NOMOUNT_REPO}" "${nm}" || { log_error "Gagal clone NoMount (${NOMOUNT_REPO})."; exit 1; }
              else
                  git -C "${nm}" reset --hard -q HEAD
                  git -C "${nm}" fetch -q --all --tags || log_warn "NoMount: gagal fetch, memakai salinan lokal yang ada."
              fi
              if git -C "${nm}" rev-parse --verify -q "origin/${NOMOUNT_REF}" >/dev/null; then
                  git -C "${nm}" checkout -q -f --detach "origin/${NOMOUNT_REF}"
              else
                  git -C "${nm}" checkout -q -f "${NOMOUNT_REF}" || { log_error "NoMount: ref '${NOMOUNT_REF}' tidak ditemukan."; exit 1; }
              fi
              [ -f "${nm}/kernel/src/nomount.c" ] || { log_error "NoMount: kernel/src/nomount.c tidak ada."; exit 1; }

              ln -sfn ../NoMount/kernel/src "${fs}/nomount"
              if ! grep -q "nomount" "${fs}/Makefile"; then
                  printf '\nobj-$(CONFIG_NOMOUNT) += nomount/\n' >> "${fs}/Makefile"
              fi
              if ! grep -q 'source "fs/nomount/Kconfig"' "${fs}/Kconfig"; then
                  awk '
                      /^endmenu/ { last = NR }
                      { lines[NR] = $0 }
                      END { for (i = 1; i <= NR; i++) { if (i == last) print "source \"fs/nomount/Kconfig\""; print lines[i] } }
                  ' "${fs}/Kconfig" > "${fs}/Kconfig.tmp" && mv "${fs}/Kconfig.tmp" "${fs}/Kconfig"
              fi
              grep -q 'source "fs/nomount/Kconfig"' "${fs}/Kconfig" || { log_error "NoMount: gagal mengubah fs/Kconfig."; exit 1; }
              log_success "NoMount: $(git -C "${nm}" log -1 --format='%h %s')"
          }

          # Aktif/nonaktifkan CONFIG_NOMOUNT di out/.config
          apply_nomount_config() {
              [ -e "${KERNEL_DIR}/fs/nomount" ] || return 0
              local cfg="${OUT_DIR}/.config" sc="${KERNEL_DIR}/scripts/config"
              if [ "${NOMOUNT}" = "1" ]; then
                  bash "${sc}" --file "${cfg}" -e NOMOUNT
              else
                  bash "${sc}" --file "${cfg}" -d NOMOUNT
              fi
              make "${MAKE_ARGS[@]}" olddefconfig >>"${LOG_FILE}" 2>&1 || { log_error "olddefconfig gagal."; exit 1; }
              if [ "${NOMOUNT}" = "1" ]; then
                  grep -q '^CONFIG_NOMOUNT=y' "${cfg}" && log_info "CONFIG_NOMOUNT=y" || log_warn "CONFIG_NOMOUNT tidak aktif di .config."
                  grep -q '^CONFIG_KEYS=y' "${cfg}" || log_warn "CONFIG_KEYS tidak aktif: NoMount berkomunikasi lewat keyring, tidak akan berfungsi."
              fi
          }

          # Kompresor zram default. Kernel 4.19 menulisnya langsung di kode (default_compressor = "lzo-rle"),
          # kernel 4.14 memakai opsi Kconfig ZRAM_DEF_COMP_* (diatur di apply_lowram_config).
          patch_zram_compressor() {
              [ "${LOWRAM}" = "1" ] || return 0
              case "${ZRAM_COMP}" in
                  lzo|lzo-rle|lz4|lz4hc|zstd) ;;
                  *) log_error "ZRAM_COMP tidak valid: '${ZRAM_COMP}' (pilih: lzo lzo-rle lz4 lz4hc zstd)"; exit 1 ;;
              esac
              local f="${KERNEL_DIR}/drivers/block/zram/zram_drv.c"
              local k="${KERNEL_DIR}/drivers/block/zram/Kconfig"
              if grep -qE 'static const char \*default_compressor = "[^"]*";' "${f}"; then
                  sed -i -E "s|(static const char \*default_compressor = )\"[^\"]*\";|\1\"${ZRAM_COMP}\";|" "${f}"
                  ZRAM_COMP_MODE="source"
                  log_info "Kompresor zram default (source): ${ZRAM_COMP}"
              elif grep -q 'config ZRAM_DEF_COMP_LZ4' "${k}" 2>/dev/null; then
                  ZRAM_COMP_MODE="kconfig"
                  log_info "Kompresor zram default (Kconfig): ${ZRAM_COMP}"
              else
                  ZRAM_COMP_MODE="none"
                  log_warn "Pola default_compressor tidak dikenali, kompresor zram tidak diubah."
              fi
          }

          # Ukuran zram minimum (idempoten). Gagal mengenali pola kode -> hanya peringatan, build lanjut.
          patch_zram_size() {
              [ "${ZRAM_MIN_PERCENT}" = "0" ] && return 0
              if ! [[ "${ZRAM_MIN_PERCENT}" =~ ^[0-9]+$ ]] || [ "${ZRAM_MIN_PERCENT}" -gt 200 ]; then
                  log_error "ZRAM_MIN_PERCENT harus angka 0-200 (sekarang: '${ZRAM_MIN_PERCENT}')"
                  exit 1
              fi
              local f="${KERNEL_DIR}/drivers/block/zram/zram_drv.c"
              [ -f "${f}" ] || { log_warn "zram_drv.c tidak ditemukan, ukuran zram tidak diubah."; return 0; }
              python3 - "${f}" "${ZRAM_MIN_PERCENT}" <<'PY' 2>&1 | tee -a "${LOG_FILE}"
          import re, sys
          p, pct = sys.argv[1], sys.argv[2]
          s = open(p).read()
          define = f"#define NEKO_ZRAM_MIN_PCT {pct}\n"
          if "NEKO_ZRAM_MIN_PCT" in s:
              open(p, "w").write(re.sub(r"#define NEKO_ZRAM_MIN_PCT \d+\n", define, s, count=1))
              print(f"[PATCH] zram_drv.c: ukuran minimum zram diperbarui -> {pct}% RAM (sudah dipatch sebelumnya)")
              sys.exit(0)
          inc = '#include "zram_drv.h"\n'
          m = re.search(r"(\tdisksize = memparse\(buf, NULL\);\n\tif \(!disksize\)\n\t\treturn -EINVAL;\n)", s)
          if inc not in s or not m:
              print("[WARN] zram_drv.c: pola disksize_store tidak dikenali, ukuran zram tidak diubah")
              sys.exit(3)
          block = (
              "\n\t/* NEKO: ukuran zram minimum = NEKO_ZRAM_MIN_PCT% dari RAM (ROM boleh minta lebih besar) */\n"
              "\t{\n"
              "\t\tstruct sysinfo neko_si;\n"
              "\t\tu64 neko_min;\n\n"
              "\t\tsi_meminfo(&neko_si);\n"
              "\t\tneko_min = (u64)neko_si.totalram * neko_si.mem_unit / 100 * NEKO_ZRAM_MIN_PCT;\n"
              "\t\tif (disksize < neko_min)\n"
              "\t\t\tdisksize = neko_min;\n"
              "\t}\n"
          )
          s = s.replace(inc, inc + define, 1)
          s = s.replace(m.group(1), m.group(1) + block, 1)
          open(p, "w").write(s)
          print(f"[PATCH] zram_drv.c: ukuran minimum zram = {pct}% dari RAM")
          PY
              [ "${PIPESTATUS[0]}" -eq 0 ] || log_warn "Patch ukuran zram dilewati (lihat pesan di atas)."
          }

          # Opsi config hemat RAM, diterapkan ke out/.config (tidak mengubah file defconfig di source)
          apply_lowram_config() {
              [ "${LOWRAM}" = "1" ] || return 0
              local cfg="${OUT_DIR}/.config" sc="${KERNEL_DIR}/scripts/config"
              local cur_shift; cur_shift=$(sed -n 's/^CONFIG_LOG_BUF_SHIFT=//p' "${cfg}")
              if [ "${LOWRAM_AGGRESSIVE}" = "1" ]; then
                  log_info "Mode hemat RAM (agresif): DEBUG_INFO/SCHEDSTATS/KPROBES dimatikan, log buffer maks 128 KB"
              else
                  log_info "Mode hemat RAM: hanya DEBUG_INFO dimatikan (SCHEDSTATS/KPROBES dibiarkan), log buffer maks 128 KB"
              fi
              if [ "${LOWRAM_AGGRESSIVE}" = "1" ]; then
                  bash "${sc}" --file "${cfg}" -d DEBUG_INFO -d SCHEDSTATS -d KPROBES
              else
                  bash "${sc}" --file "${cfg}" -d DEBUG_INFO
              fi
              # log buffer hanya diperkecil, tidak pernah diperbesar
              if [ -z "${cur_shift}" ] || [ "${cur_shift}" -gt 17 ]; then
                  bash "${sc}" --file "${cfg}" --set-val LOG_BUF_SHIFT 17
              fi
              # Kompresor zram lewat Kconfig (kernel 4.14) + pastikan algoritma crypto-nya ikut ada
              if [ "${ZRAM_COMP_MODE:-}" = "kconfig" ]; then
                  local sym
                  case "${ZRAM_COMP}" in
                      lzo-rle) sym=ZRAM_DEF_COMP_LZORLE ;;
                      lzo)     sym=ZRAM_DEF_COMP_LZO ;;
                      lz4)     sym=ZRAM_DEF_COMP_LZ4 ;;
                      lz4hc)   sym=ZRAM_DEF_COMP_LZ4HC ;;
                      zstd)    sym=ZRAM_DEF_COMP_ZSTD ;;
                  esac
                  bash "${sc}" --file "${cfg}" -e "${sym}"
              fi
              case "${ZRAM_COMP}" in
                  lz4)   bash "${sc}" --file "${cfg}" -e CRYPTO_LZ4 ;;
                  lz4hc) bash "${sc}" --file "${cfg}" -e CRYPTO_LZ4HC ;;
                  zstd)  bash "${sc}" --file "${cfg}" -e CRYPTO_ZSTD ;;
              esac
              make "${MAKE_ARGS[@]}" olddefconfig >>"${LOG_FILE}" 2>&1 || { log_error "olddefconfig gagal."; exit 1; }
              # Periksa hasilnya (sebagian opsi bisa dipaksa aktif oleh Kconfig lain)
              local opt
              local opts="DEBUG_INFO"; [ "${LOWRAM_AGGRESSIVE}" = "1" ] && opts="DEBUG_INFO SCHEDSTATS KPROBES"
              for opt in ${opts}; do
                  grep -q "^CONFIG_${opt}=y" "${cfg}" && log_warn "CONFIG_${opt} tetap aktif (dipaksa oleh opsi lain)."
              done
              if [ "${ZRAM_COMP_MODE:-}" = "kconfig" ] && ! grep -q "^CONFIG_ZRAM_DEF_COMP=\"${ZRAM_COMP}\"" "${cfg}"; then
                  log_warn "Kompresor zram di .config bukan '${ZRAM_COMP}': $(grep '^CONFIG_ZRAM_DEF_COMP=' "${cfg}")"
              fi
          }

          apply_localversion() {
              if [[ "${LOCALVERSION_SUFFIX}" =~ [[:space:]] ]] || [ "${#LOCALVERSION_SUFFIX}" -gt 64 ]; then
                  log_error "LOCALVERSION tidak boleh mengandung spasi dan maks 64 karakter: '${LOCALVERSION_SUFFIX}'"
                  exit 1
              fi
              if [ "${REMOVE_LOCALVERSION_FILES}" = "1" ]; then
                  local f
                  for f in "${KERNEL_DIR}"/localversion*; do
                      [ -f "${f}" ] || continue
                      log_info "Hapus $(basename "${f}") ($(cat "${f}"))"
                      rm -f "${f}"
                  done
              fi
              log_info "LOCALVERSION = \"${LOCALVERSION_SUFFIX}\""
              bash "${KERNEL_DIR}/scripts/config" --file "${OUT_DIR}/.config" --set-str LOCALVERSION "${LOCALVERSION_SUFFIX}"
              if [ "${DISABLE_LOCALVERSION_AUTO}" = "1" ]; then
                  bash "${KERNEL_DIR}/scripts/config" --file "${OUT_DIR}/.config" -d LOCALVERSION_AUTO
                  # .scmversion kosong -> kernel tidak menambah "+" / -dirty / -g<hash> kalau source berupa repo git
                  : > "${KERNEL_DIR}/.scmversion"
              fi
              make "${MAKE_ARGS[@]}" olddefconfig >>"${LOG_FILE}" 2>&1 || { log_error "olddefconfig gagal."; exit 1; }
          }

          build_kernel() {
              log_info "Membuat konfigurasi: ${CONFIG_TARGETS[*]}..."
              make "${MAKE_ARGS[@]}" "${CONFIG_TARGETS[@]}" 2>&1 | tee -a "${LOG_FILE}"
              [ "${PIPESTATUS[0]}" -eq 0 ] || { log_error "Gagal membuat konfigurasi!"; exit 1; }
              verify_config
              apply_localversion
              apply_lowram_config
              apply_nomount_config
              fix_compat_vdso

              # Header arch/uapi dibuat serial dulu supaya tidak balapan dengan kompilasi paralel
              log_info "Menyiapkan header arch (serial)..."
              make "${MAKE_ARGS[@]}" -j1 archheaders 2>&1 | tee -a "${LOG_FILE}"
              [ "${PIPESTATUS[0]}" -eq 0 ] || { log_error "archheaders gagal!"; exit 1; }

              log_info "Mulai kompilasi dengan ${JOBS} jobs..."
              echo -e "${YELLOW}======================================${NC}"
              local start end
              start=$(date +%s)

              make "${MAKE_ARGS[@]}" 2>&1 | tee -a "${LOG_FILE}"

              end=$(date +%s)
              echo -e "${YELLOW}======================================${NC}"

              local boot="${OUT_DIR}/arch/arm64/boot"
              if   [ -f "${boot}/Image.gz-dtb" ]; then KERNEL_IMG="${boot}/Image.gz-dtb"
              elif [ -f "${boot}/Image.gz"     ]; then KERNEL_IMG="${boot}/Image.gz"
              elif [ -f "${boot}/Image"        ]; then KERNEL_IMG="${boot}/Image"
              else
                  log_error "Kompilasi GAGAL! Lihat: grep -iE 'error:' ${KERNEL_DIR}/error.log"
                  exit 1
              fi

              local diff=$((end - start))
              log_success "Kernel berhasil dikompilasi: ${KERNEL_IMG}"
              [ -f "${OUT_DIR}/include/config/kernel.release" ] && \
                  log_info "Versi kernel (uname -r): $(cat "${OUT_DIR}/include/config/kernel.release")"
              log_info "Waktu: $((diff / 60)) menit $((diff % 60)) detik"
          }

          # Menulis anykernel.sh khusus RM6785 (boot only, tanpa contoh ramdisk "tuna" bawaan upstream)
          write_anykernel_sh() {
              local f="$1" i=0 d devlines=""
              for d in ${AK_DEVICES}; do i=$((i + 1)); devlines+="device.name${i}=${d}"$'\n'; done
              cat > "${f}" <<EOF
          ### AnyKernel3 Ramdisk Mod Script
          ## osm0sis @ xda-developers

          ### AnyKernel setup
          # global properties
          properties() { '
          kernel.string=${AK_KERNEL_STRING}
          do.devicecheck=1
          do.modules=0
          do.systemless=1
          do.cleanup=1
          do.cleanuponabort=0
          ${devlines}supported.versions=
          supported.patchlevels=
          supported.vendorpatchlevels=
          '; } # end properties


          ### AnyKernel install
          ## boot files attributes
          boot_attributes() {
          set_perm_recursive 0 0 755 644 \$RAMDISK/*;
          set_perm_recursive 0 0 750 750 \$RAMDISK/init* \$RAMDISK/sbin;
          } # end attributes

          # boot shell variables
          BLOCK=/dev/block/by-name/boot;
          IS_SLOT_DEVICE=0;
          RAMDISK_COMPRESSION=auto;
          PATCH_VBMETA_FLAG=auto;

          # import functions/variables and setup patching - see for reference (DO NOT REMOVE)
          . tools/ak3-core.sh;

          # boot install
          dump_boot;

          write_boot;
          ## end boot install
          EOF
          }

          # Sisipkan banner (gaya zip AnyKernel lama) ke update-binary
          patch_banner() {
              local ub="$1"
              local banner="${TMPDIR:-/tmp}/ak_banner.$$"
              local author_pad
              author_pad=$(printf '%s' "By ${AK_AUTHOR}")
              cat > "${banner}" <<EOF
          ui_print "|----------------------------------------------|";
          ui_print " ";
          ui_print "|+-+-+-+-+-+-|  N E K O  -  K E R N E L  |+-+-++-+-+-|";
          ui_print " ";
          ui_print "|+-+-+-+-+-+-|\\\\___________________/|+-+-++-+-+-|";
          ui_print " ";
          ui_print "|+-+-+-+-+-+-+-+-+-|FOR RM6785|+-+-+-+-+-+-+-+-|";
          ui_print " ";
          ui_print "|+-+-+-+-+-+-+|${author_pad}|+-+-+-+-+-+-|";
          ui_print " ";
          ui_print "|-------------|###################|------------|";
          EOF
              python3 - "${ub}" "${banner}" <<'PY' || return 1
          import sys
          ub, bn = sys.argv[1], sys.argv[2]
          s = open(ub).read()
          b = open(bn).read()
          anchor = 'ui_print " " "AnyKernel3 by osm0sis @ xda-developers" " ";'
          if anchor not in s:
              sys.exit(1)
          s = s.replace(anchor, b + "\n" + anchor, 1)
          open(ub, "w").write(s)
          PY
              rm -f "${banner}"
          }

          package_zip() {
              if [ ! -d "${ANYKERNEL_DIR}" ]; then
                  log_info "Clone AnyKernel3..."
                  git clone --depth=1 "${ANYKERNEL_REPO}" "${ANYKERNEL_DIR}" &>/dev/null || {
                      log_warn "Gagal clone AnyKernel3, lewati pembuatan zip."
                      return
                  }
              fi

              log_info "Membuat zip flashable..."
              # Kerja di salinan sementara supaya template ${ANYKERNEL_DIR} tetap bersih
              local work; work=$(mktemp -d)
              cp -a "${ANYKERNEL_DIR}/." "${work}/"
              rm -rf "${work}/.git"
              cp -f "${KERNEL_IMG}" "${work}/"
              # DTB sudah ter-append di Image.gz-dtb; dtbo memakai bawaan ROM (tidak diflash dari sini).

              write_anykernel_sh "${work}/anykernel.sh"
              patch_banner "${work}/META-INF/com/google/android/update-binary" || \
                  log_warn "Banner tidak bisa disisipkan (update-binary AnyKernel3 berubah?). Zip tetap dibuat tanpa banner."

              local zip_file="${KERNEL_DIR}/${ZIP_NAME}-$(date +%Y%m%d-%H%M).zip"
              ( cd "${work}" && zip -r9 "${zip_file}" . -x '.git*' 'README.md' '*placeholder' >/dev/null )
              rm -rf "${work}"
              log_success "Zip: ${zip_file}"
              log_info "Nama di recovery: '${AK_KERNEL_STRING}' | By ${AK_AUTHOR} | perangkat: ${AK_DEVICES%% *} dst, block=boot"
          }

          # ========================
          # ENTRY POINT
          # ========================
          case "$1" in
              clang-list)
                  list_clang
                  ;;
              clean)
                  get_source
                  cleanup
                  log_success "Bersih."
                  ;;
              menuconfig)
                  check_deps; get_source; get_clang; check_defconfig; setup_nomount; setup_env
                  mkdir -p "${OUT_DIR}"
                  make "${MAKE_ARGS[@]}" "${CONFIG_TARGETS[@]}" && make "${MAKE_ARGS[@]}" menuconfig
                  ;;
              *)
                  [ -d "${KERNEL_DIR}" ] && : > "${LOG_FILE}"   # buang log lama
                  check_deps
                  get_source
                  get_clang
                  check_defconfig
                  patch_swappiness
                  patch_vm_tuning
                  patch_dtb_append
                  patch_zram_compressor
                  patch_zram_size
                  setup_nomount
                  [ "${INCREMENTAL:-0}" = "1" ] || cleanup
                  mkdir -p "${OUT_DIR}"
                  setup_env
                  build_kernel
                  package_zip
                  ;;
          esac
          BUILD_SCRIPT_EOF
          chmod +x "$HOME/work/build.sh"
          bash -n "$HOME/work/build.sh"

      - name: Build kernel
        env:
          KERNEL_REPO: ${{ inputs.kernel_repo }}
          KERNEL_BRANCH: ${{ inputs.kernel_branch }}
          KERNEL_REPO_TOKEN: ${{ inputs.private_repo_token || secrets.KERNEL_REPO_TOKEN }}
          NEMO_CONFIGS: ${{ inputs.defconfig }}
          STABLE: ${{ inputs.stable_mode && '1' || '0' }}
          VM_TUNE: ${{ inputs.vm_tune && '1' || '0' }}
          NOMOUNT: ${{ inputs.enable_nomount && '1' || '0' }}
          NOMOUNT_REF: ${{ inputs.nomount_ref }}
          LOCALVERSION: ${{ inputs.localversion }}
          SWAPPINESS_PATCH: ${{ inputs.swappiness_default == 'off' && '0' || '1' }}
          SWAPPINESS_DEFAULT: ${{ inputs.swappiness_default == 'off' && '100' || inputs.swappiness_default }}
          SWAPPINESS_LOCK: ${{ inputs.swappiness_lock && '1' || '0' }}
          LOWRAM: ${{ inputs.lowram_mode == 'off' && '0' || '1' }}
          LOWRAM_AGGRESSIVE: ${{ inputs.aggressive_debug_off && '1' || '0' }}
          ZRAM_MIN_PERCENT: ${{ inputs.zram_size_percent }}
          ZRAM_COMP: ${{ inputs.lowram_mode == 'off' && 'lz4' || inputs.lowram_mode }}
          CLANG_TYPE: ${{ inputs.clang_toolchain }}
          GF_CLANG_VERSION: ${{ inputs.clang_version }}
          ZIP_NAME: ${{ inputs.zip_name }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          cd "$HOME/work"
          if [ -n "$KERNEL_REPO_TOKEN" ]; then echo "::add-mask::$KERNEL_REPO_TOKEN"; fi
          bash build.sh 2>&1 | tee "$HOME/work/ci-build.log"

      - name: Cari ZIP hasil build
        env:
          IN_REPO: ${{ inputs.kernel_repo }}
          IN_BRANCH: ${{ inputs.kernel_branch }}
        run: |
          src="$HOME/work/android_kernel_realme_nemo"
          [ -d "$src" ] || src="$(find "$HOME/work" -maxdepth 2 -name Makefile -path '*/*/Makefile' -printf '%h\n' | head -n1)"
          zip="$(find "$src" -maxdepth 1 -name '*.zip' -printf '%T@ %p\n' 2>/dev/null | sort -nr | head -n1 | cut -d' ' -f2- || true)"
          if [ -z "$zip" ]; then
            echo "::error::ZIP tidak ditemukan. Kernel mungkin gagal dibuat atau AnyKernel3 gagal di-clone. Lihat log build."
            exit 1
          fi
          rel="$(cat "$src/out/include/config/kernel.release" 2>/dev/null || echo '?')"
          clang_bin="$(find "$HOME/work" -maxdepth 3 -path '*/bin/clang' \( -type f -o -type l \) 2>/dev/null | head -n1)"
          clang_ver="N/A"
          clang_tag=""
          if [ -n "$clang_bin" ]; then
            tagf="$(dirname "$(dirname "$clang_bin")")/.gf_tag"
            [ -f "$tagf" ] && clang_tag="$(cat "$tagf")"
            clang_ver="$("$clang_bin" --version | head -n1 | sed -n 's/.*clang version \([0-9.]*\).*/\1/p')"
            [ -n "$clang_ver" ] || clang_ver="unknown"
          fi
          base="${IN_REPO%.git}"
          full="$(git -C "$src" rev-parse HEAD 2>/dev/null || echo '')"
          {
            echo "SRC_DIR=$src"
            echo "ZIP_PATH=$zip"
            echo "KERNEL_RELEASE=$rel"
            echo "CLANG_INFO=$clang_ver"
            echo "CLANG_TAG=$clang_tag"
            echo "NOMOUNT_COMMIT=$(git -C "$src/NoMount" rev-parse --short HEAD 2>/dev/null || echo '-')"
            echo "BUILD_DURATION=$(( $(date +%s) - START_TS ))"
            echo "COMMIT_MSG=$(git -C "$src" log -1 --pretty=format:'%s' 2>/dev/null || echo '-')"
            echo "COMMIT_URL=${base}/commit/${full}"
            echo "BRANCH_NAME=${IN_BRANCH:-$(git -C "$src" rev-parse --abbrev-ref HEAD 2>/dev/null || echo default)}"
          } >> "$GITHUB_ENV"
          ls -lh "$zip"
          echo "Versi kernel: $rel | Clang: $clang_ver"

      - name: Upload ZIP
        uses: actions/upload-artifact@v4
        with:
          name: kernel-zip-${{ github.run_number }}
          path: ${{ env.ZIP_PATH }}
          retention-days: 14
          if-no-files-found: error

      - name: Upload log build
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs-${{ github.run_number }}
          path: |
            ~/work/ci-build.log
            ~/work/android_kernel_realme_nemo/error.log
          retention-days: 7
          if-no-files-found: ignore

      - name: Kirim ZIP ke Telegram
        if: success()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          CUSTOM_NOTE: ${{ inputs.custom_note }}
          NOMOUNT_ON: ${{ inputs.stable_mode && 'Stable' || (inputs.enable_nomount && 'NoMount' || 'Normal') }}
          NOMOUNT_REF_IN: ${{ inputs.nomount_ref }}
          SWAP_IN: ${{ inputs.swappiness_default }}
          SWAP_LOCK: ${{ inputs.swappiness_lock && 'locked' || 'unlocked' }}
          LOWRAM_IN: ${{ inputs.lowram_mode }}
          ZRAM_PCT_IN: ${{ inputs.stable_mode && '0' || inputs.zram_size_percent }}
          CLANG_NAME: ${{ inputs.clang_toolchain }}
        run: |
          if [ -z "$TELEGRAM_BOT_TOKEN" ] || [ -z "$TELEGRAM_CHAT_ID" ]; then
            echo "Secret Telegram tidak diisi, lewati."; exit 0
          fi
          esc() { printf '%s' "$1" | sed 's/[]\_*[()~`>#+=|{}.!-]/\\&/g'; }
          esc_url() { printf '%s' "$1" | sed 's/[\\()]/\\&/g'; }

          zipfile="$(basename "$ZIP_PATH")"
          variant="$NOMOUNT_ON"
          [ "$NOMOUNT_ON" = "NoMount" ] && variant="NoMount (${NOMOUNT_REF_IN} @ ${NOMOUNT_COMMIT:--})"
          swap="off"
          [ "$SWAP_IN" != "off" ] && swap="${SWAP_IN} (${SWAP_LOCK})"
          zr="$LOWRAM_IN"
          [ "${ZRAM_PCT_IN:-0}" != "0" ] && zr="${LOWRAM_IN}, min ${ZRAM_PCT_IN}% RAM"
          cap="$(mktemp)"
          {
            printf '✅ *Build Successful* ✅\n\n'
            printf '%s\n\n' "$(esc "$zipfile")"
            printf '*Branch:* %s\n' "$(esc "$BRANCH_NAME")"
            printf '*Commit:* [%s](%s)\n' "$(esc "$COMMIT_MSG")" "$(esc_url "$COMMIT_URL")"
            printf '*Time:* %s\n' "$(esc "$(( BUILD_DURATION / 60 ))m $(( BUILD_DURATION % 60 ))s")"
            printf '*Build Variant:* %s\n' "$(esc "$variant")"
            printf '*Kernel:* %s\n' "$(esc "$KERNEL_RELEASE")"
            printf '*Swappiness:* %s\n' "$(esc "$swap")"
            printf '*Zram:* %s\n' "$(esc "$zr")"
            case "$CLANG_NAME" in weebx) cname="WeebX" ;; zyc) cname="ZyC" ;; *) cname="${CLANG_NAME^}" ;; esac
            printf '*Clang:* %s\n' "$(esc "$cname $CLANG_INFO${CLANG_TAG:+ (tag $CLANG_TAG)}")"
            if [ -n "$CUSTOM_NOTE" ]; then printf '\n*Note:* %s\n' "$(esc "$CUSTOM_NOTE")"; fi
            printf '\n[View Run](%s)\n' "$(esc_url "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}")"
          } > "$cap"
          resp="$(curl -sS --max-time 300 -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendDocument" \
            -F chat_id="$TELEGRAM_CHAT_ID" \
            -F parse_mode="MarkdownV2" \
            -F "caption=<$cap" \
            -F "document=@$ZIP_PATH" || true)"
          rm -f "$cap"
          if printf '%s' "$resp" | grep -q '"ok":true'; then
            echo "ZIP terkirim ke Telegram."
          else
            echo "::warning::Telegram menolak kiriman (build tetap sukses): $resp"
          fi

      - name: Kabari Telegram jika gagal
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          CUSTOM_NOTE: ${{ inputs.custom_note }}
          IN_BRANCH: ${{ inputs.kernel_branch }}
          NOMOUNT_ON: ${{ inputs.stable_mode && 'Stable' || (inputs.enable_nomount && 'NoMount' || 'Normal') }}
        run: |
          if [ -z "$TELEGRAM_BOT_TOKEN" ] || [ -z "$TELEGRAM_CHAT_ID" ]; then exit 0; fi
          esc() { printf '%s' "$1" | sed 's/[]\_*[()~`>#+=|{}.!-]/\\&/g'; }
          esc_url() { printf '%s' "$1" | sed 's/[\\()]/\\&/g'; }
          msg="$(mktemp)"
          {
            printf '❌ *Build Failed* ❌\n\n'
            printf '*Branch:* %s\n' "$(esc "${IN_BRANCH:-default}")"
            printf '*Build Variant:* %s\n' "$(esc "$NOMOUNT_ON")"
            if [ -n "$CUSTOM_NOTE" ]; then printf '\n*Note:* %s\n' "$(esc "$CUSTOM_NOTE")"; fi
            printf '\n[View Logs](%s)\n' "$(esc_url "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}")"
          } > "$msg"
          resp="$(curl -sS --max-time 60 -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d chat_id="$TELEGRAM_CHAT_ID" \
            -d parse_mode="MarkdownV2" \
            -d disable_web_page_preview=true \
            --data-urlencode "text@$msg" || true)"
          rm -f "$msg"
          if printf '%s' "$resp" | grep -q '"ok":true'; then
            echo "Notifikasi kegagalan terkirim ke Telegram."
          else
            echo "::warning::Telegram menolak pesan: $resp"
          fi

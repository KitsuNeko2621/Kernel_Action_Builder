name: Build Kernel

on:
  workflow_dispatch:
    inputs:
      kernel_repo:
        description: 'Kernel Repository URL'
        required: true
        type: string
        default: 'https://github.com/Chitransh193/android_kernel_realme_mt6785.git'
      kernel_branch:
        description: 'Kernel Branch'
        required: true
        type: string
        default: 'main'
      defconfig:
        description: 'Defconfig name (e.g. RM6785_defconfig)'
        required: true
        type: string
        default: 'RM6785_defconfig'
      private_repo_token:
        description: 'GitHub Token (only if kernel repo is private)'
        required: false
        type: string
        default: ''
      enable_ksu:
        description: 'Enable KernelSU'
        required: true
        type: boolean
        default: false
      ksu_variant:
        description: 'KernelSU Variant (only if KSU enabled)'
        required: false
        type: choice
        options:
          - 'xxKSU'
          - 'SukiSU'
          - 'BakaSU'
          - 'KernelSU-Next'
          - 'KernelSU'
        default: 'BakaSU'
      enable_susfs:
        description: 'Enable SUSFS'
        required: false
        type: boolean
        default: false
      enable_nomount:
        description: 'Enable NoMount'
        required: false
        type: boolean
        default: true
      nomount_ref:
        description: 'NoMount branch/tag/commit (only if NoMount enabled)'
        required: false
        type: string
        default: 'dev'
      custom_note:
        description: 'Custom build note (optional)'
        required: false
        default: ''
      zip_name:
        description: 'Kernel ZIP name prefix'

